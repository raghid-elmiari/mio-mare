<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💝 Surprise</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body style="background: linear-gradient(135deg, #ff758c, #ff7eb3); margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;">
    <audio id="bgMusic" loop>
        <source src="./hi.mp4" type="audio/mpeg">
    </audio>
    <!-- 10 BALLOONS – no title -->
    <div class="balloon-section" style="margin-top:0;">
        <div class="balloon-grid" id="balloonGrid">
            <div class="balloon-item"><div class="balloon"></div></div>
            <div class="balloon-item"><div class="balloon"></div></div>
            <div class="balloon-item"><div class="balloon"></div></div>
            <div class="balloon-item"><div class="balloon"></div></div>
            <div class="balloon-item"><div class="balloon"></div></div>
            <div class="balloon-item"><div class="balloon"></div></div>
            <div class="balloon-item"><div class="balloon"></div></div>
            <div class="balloon-item"><div class="balloon"></div></div>
            <div class="balloon-item"><div class="balloon"></div></div>
            <div class="balloon-item"><div class="balloon"></div></div>
        </div>
        <button id="backToMainBtn" class="back-btn">🔙 back</button>
    </div>

    <!-- PHOTO POP‑UP (hidden until balloon is clicked) -->
    <div id="photoPopup" class="photo-popup">
        <div class="popup-content">
            <img id="popupImage" class="popup-image" src="" alt="surprise">
            <div id="popupDesc" class="popup-desc"></div>
        </div>
    </div>

    <script src="balloons.js"></script>
</body>
</html>
