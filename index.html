<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mio Mare 💖</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="lockScreen">
    <div class="lock-box">
        <h2>🔐 A Secret For You</h2>
        <p>Enter the password to open my heart 💕</p>
        <input type="password" id="passwordInput" placeholder="Password">
        <button id="unlockBtn">Unlock 💖</button>
        <div id="errorMsg">Wrong password dear it your password 😢</div>
    </div>
</div>

<!-- MAIN CONTENT -->
<div id="mainContent" style="display:none;">

    <!-- Background Music -->
    <audio id="bgMusic" loop>
        <source src="hi.mp4" type="audio/mpeg">
    </audio>

    <div class="hearts"></div>

    <div class="container">

        <!-- Photo Upload -->
        <div class="photo-box">
            <label for="photoInput" class="photo-label">
                <img id="photoPreview" src="./mio.jpeg" alt="Mio Mare"> 
            </label>
            <input type="file" id="photoInput" accept="image/*">

            <div class="time-text">(4:00 – 4:25)</div>
        </div>

        <h1 class="title">💖 Mio Mare 💖</h1>
        <div id="loveText">Mio mare ti amo</div>
        <button id="musicBtn">🔊 Music</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
